<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OAS-UI Templates</title>
    <style>
      :root {
        --bg: #0b0f1a;
        --card: #141a2a;
        --border: #232c44;
        --text: #e8ecf5;
        --muted: #8a94ad;
        --primary: #0b6cff;
        --radius: 12px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background: radial-gradient(900px 600px at 50% -120px, rgba(11,108,255,.18), transparent 70%), var(--bg);
      }
      .wrap { max-width: 1080px; margin: 0 auto; padding: 56px 24px 80px; }
      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
      .logo {
        width: 40px; height: 40px; border-radius: 10px;
        display: grid; place-items: center;
        background: linear-gradient(135deg, #0b6cff, #7c3aed);
        font-weight: 800; font-size: 15px; color: #fff; letter-spacing: -0.5px;
      }
      h1 { margin: 0 0 8px; font-size: 28px; font-weight: 700; }
      .subtitle { margin: 0 0 40px; font-size: 15px; color: var(--muted); line-height: 1.6; }
      .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
      .card {
        display: block; text-decoration: none; color: inherit;
        background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 22px; transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
      }
      .card:hover { transform: translateY(-3px); border-color: var(--primary); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
      .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      .card-name { font-size: 17px; font-weight: 600; }
      .tag {
        font-size: 12px; padding: 3px 8px; border-radius: 999px;
        background: rgba(11,108,255,.14); color: #7ab0ff;
      }
      .card-desc { margin: 0 0 14px; font-size: 14px; color: var(--muted); line-height: 1.55; }
      .meta { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip {
        font-size: 12px; padding: 2px 8px; border-radius: 6px;
        background: rgba(255,255,255,.05); color: var(--muted); border: 1px solid var(--border);
      }
      .foot { margin-top: 48px; text-align: center; font-size: 13px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand"><div class="logo">OAS</div></div>
      <h1>OAS-UI Templates</h1>
      <p class="subtitle">基于 oas-ui Web Components 的官方模板集合。零框架运行时，TypeScript + Vite，即取即用。</p>

      <div class="grid">
        <a class="card" href="./admin-pro/vanilla-html/">
          <div class="card-head">
            <span class="card-name">admin-pro / vanilla-html</span>
            <span class="tag">admin</span>
          </div>
          <p class="card-desc">后台管理系统模板：i18n / 权限守卫 / 多页签 / 数据可视化 / 表单 / 请求层。</p>
          <div class="meta">
            <span class="chip">Vite + TS</span>
            <span class="chip">Web Components</span>
            <span class="chip">零框架运行时</span>
          </div>
        </a>
      </div>

      <p class="foot">OAS-UI Templates · MIT OR Apache-2.0</p>
    </div>
  </body>
</html>
