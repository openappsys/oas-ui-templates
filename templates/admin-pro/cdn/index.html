<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OAS Admin CDN</title>
    <script>
      // 入口防 FOUC：<head> 同步决定 <html lang>，与 i18n.js detectLocale 逻辑一致
      // 优先级：localStorage 已保存 → navigator.language 嗅探（zh 系列 → zh-CN，其余一律 en）
      (function () {
        try {
          var saved = localStorage.getItem('oas-admin-cdn.locale')
          if (saved === 'zh-CN' || saved === 'en') {
            document.documentElement.lang = saved
            return
          }
          var nav = (navigator.language || '').toLowerCase()
          document.documentElement.lang = nav === 'zh' || nav.indexOf('zh-') === 0 ? 'zh-CN' : 'en'
        } catch (e) {
          /* 无 storage / noop */
        }
      })()
    </script>
    <link rel="stylesheet" href="https://unpkg.com/@oas-ui/theme@2.5.3/index.css" />
    <link rel="stylesheet" href="./pages.css" />
    <link rel="stylesheet" href="./pages-more.css" />
    <link rel="stylesheet" href="./pages-b.css" />
    <link rel="stylesheet" href="./pages-c.css" />
    <script src="https://unpkg.com/@oas-ui/ui@2.5.3/dist/cdn.js"></script>
    <script src="./js/icon-patch.js"></script>
    <style>
      /* 壳层与登录页样式：只消费 theme 的 --oas-* token，不硬编码色值 */
      /* 变量补充（vanilla app.css 同值）：tint 给 iconColor、control-height-lg 控侧栏菜单行高 32px */
      :root {
        --oas-tint-violet: #7c3aed;
        --oas-tint-cyan: #0ea5e9;
        --oas-control-height-lg: 32px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: var(--oas-color-text-primary);
        background: var(--oas-color-bg);
      }
      .app-header {
        display: flex;
        align-items: center;
        gap: var(--oas-space-3);
        height: 56px;
        padding: 0 var(--oas-space-4);
        padding-left: calc(var(--oas-space-4) + var(--oas-space-3) + var(--oas-space-2));
        border-bottom: 1px solid var(--oas-color-border);
      }
      .oas-logo { display: inline-flex; align-items: center; gap: var(--oas-space-2); white-space: nowrap; }
      .oas-logo-badge {
        display: inline-flex; align-items: center; justify-content: center;
        width: 28px; height: 28px; border-radius: 8px;
        background: var(--oas-color-primary); color: #fff;
        font-family: ui-monospace, monospace; font-weight: 700; font-size: 11px; letter-spacing: 0.5px;
      }
      .oas-logo-word { font-weight: 700; font-size: 15px; }
      .spacer { flex: 1; }
      .icon-btn {
        appearance: none;
        border: none;
        background: none;
        padding: var(--oas-space-1) var(--oas-space-2);
        border-radius: var(--oas-radius-sm);
        color: var(--oas-color-text-secondary);
        cursor: pointer;
        font: inherit;
      }
      .icon-btn:hover { color: var(--oas-color-primary); background: var(--oas-color-bg-hover); }
      .page { padding: var(--oas-space-4); }
      .page-title { margin: 0 0 var(--oas-space-1); font-size: 18px; font-weight: 600; }
      .page-subtitle { margin: 0 0 var(--oas-space-4); font-size: 13px; color: var(--oas-color-text-secondary); }
      .stat-grid {
        display: grid;
        gap: var(--oas-space-3);
        grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr));
        margin-bottom: var(--oas-space-3);
      }
      .stat-card { padding: var(--oas-space-3); min-height: 112px; }
      .stat-card--skeleton oas-skeleton { height: 96px; }
      .stat-card, .chart-grid > oas-card {
        transition: transform var(--oas-transition-fast, 120ms) var(--oas-ease-out, ease-out);
      }
      .stat-card:hover, .chart-grid > oas-card:hover { transform: translateY(-2px); }
      .stat-row { display: flex; align-items: center; gap: var(--oas-space-3); }
      .stat-icon {
        flex-shrink: 0;
        display: inline-flex; align-items: center; justify-content: center;
        width: 40px; height: 40px; border-radius: var(--oas-radius-md);
        background: color-mix(in srgb, var(--stat-icon-bg, var(--oas-color-primary)) 12%, transparent);
        color: var(--stat-icon-color, var(--oas-color-primary));
      }
      .stat-body { flex: 1; min-width: 0; }
      .stat-label { font-size: var(--oas-font-size-xs); color: var(--oas-color-text-secondary); line-height: 1.4; }
      .stat-value {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 22px; font-weight: 700; color: var(--oas-color-text-primary);
        line-height: 1.4; margin: 2px 0;
      }
      .stat-delta { display: inline-flex; align-items: center; gap: 4px; font-size: var(--oas-font-size-xs); }
      .delta-up { color: var(--oas-color-success); }
      .delta-down { color: var(--oas-color-danger); }
      .stat-delta-label { color: var(--oas-color-text-secondary); }
      .chart-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr));
        gap: var(--oas-space-3);
        margin-bottom: var(--oas-space-3);
      }
      .chart { width: 100%; }
      .donut-legend { margin-top: var(--oas-space-2); }
      .donut-total {
        display: flex; align-items: baseline; justify-content: center;
        gap: var(--oas-space-1); color: var(--oas-color-text-primary);
        font-weight: 600; margin-bottom: var(--oas-space-1);
      }
      .donut-total .mono { font-size: var(--oas-font-size-lg); }
      .donut-legend-items {
        display: flex; flex-wrap: wrap; justify-content: center;
        gap: var(--oas-space-1) var(--oas-space-4);
        font-size: var(--oas-font-size-sm); color: var(--oas-color-text-secondary);
      }
      .donut-legend-item { display: inline-flex; align-items: center; gap: var(--oas-space-1); }
      .donut-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dot); }
      .donut-legend-pct { color: var(--oas-color-text-primary); }
      .bottom-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: var(--oas-space-3); }
      .top5-list { display: flex; flex-direction: column; }
      .top5-row {
        display: flex; align-items: center; gap: var(--oas-space-2);
        padding: var(--oas-space-2) 0; border-bottom: 1px solid var(--oas-color-border);
      }
      .top5-row:last-child { border-bottom: none; }
      .top5-rank {
        flex-shrink: 0;
        display: inline-flex; align-items: center; justify-content: center;
        width: 22px; height: 22px; border-radius: 50%;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px; font-weight: 700;
        background: var(--oas-color-bg-hover); color: var(--oas-color-text-secondary);
      }
      .top5-rank.rank-1 {
        background: color-mix(in srgb, var(--oas-rank-blue-1, var(--oas-color-primary)) 14%, transparent);
        color: var(--oas-rank-blue-1, var(--oas-color-primary));
      }
      .top5-rank.rank-2 {
        background: color-mix(in srgb, var(--oas-rank-blue-2, var(--oas-color-primary)) 14%, transparent);
        color: var(--oas-rank-blue-2, var(--oas-color-primary));
      }
      .top5-rank.rank-3 {
        background: color-mix(in srgb, var(--oas-rank-blue-3, var(--oas-color-primary)) 14%, transparent);
        color: var(--oas-rank-blue-3, var(--oas-color-primary));
      }
      .top5-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--oas-space-2); }
      .top5-line { display: flex; align-items: center; gap: var(--oas-space-2); min-width: 0; }
      .top5-name {
        flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font-size: var(--oas-font-size-sm); color: var(--oas-color-text-primary);
      }
      .top5-tag::part(tag) {
        background: var(--oas-color-bg-hover); border-color: transparent; color: var(--oas-color-text-secondary);
      }
      .top5-bar { flex: 1; min-width: 0; }
      .top5-bar::part(track) { height: 6px; }
      .top5-bar::part(bar) {
        border-radius: inherit;
        background: linear-gradient(90deg, color-mix(in srgb, var(--oas-color-primary) 62%, transparent), var(--oas-color-primary));
      }
      .top5-sold {
        flex-shrink: 0; min-width: 30px; text-align: right;
        font-size: var(--oas-font-size-sm); font-weight: 600; color: var(--oas-color-text-primary);
      }
      .quick-card::part(body) { display: flex; flex-direction: column; }
      .quick-actions { flex: 1; display: flex; flex-direction: column; }
      .quick-action {
        flex: 1;
        display: flex; align-items: center; gap: var(--oas-space-3);
        padding: var(--oas-space-2) 0;
        border-bottom: 1px solid var(--oas-color-border);
        font-size: var(--oas-font-size-sm); color: var(--oas-color-text-primary);
        text-decoration: none; transition: color 0.15s ease;
      }
      .quick-action:last-child { border-bottom: none; }
      .quick-action oas-icon { flex-shrink: 0; color: var(--oas-color-text-secondary); transition: color 0.15s ease; }
      .quick-action span { flex: 1; min-width: 0; }
      .quick-action:hover { color: var(--oas-color-primary); }
      .quick-action:hover oas-icon { color: var(--oas-color-primary); }
      .quick-foot { margin-top: var(--oas-space-3); font-size: 12px; color: var(--oas-color-text-secondary); }
      .users-toolbar { display: flex; align-items: center; gap: var(--oas-space-2); flex-wrap: wrap; }
      .users-toolbar oas-input { width: 220px; }
      .users-toolbar oas-select { width: 140px; }
      .table-hidden { display: none !important; }
      oas-table::part(table) { min-width: max-content; }
      .detail-header {
        display: flex; align-items: center; gap: var(--oas-space-3); margin-bottom: var(--oas-space-4);
      }
      .detail-name { font-size: 18px; font-weight: 700; color: var(--oas-color-text-primary); line-height: 1.4; }
      .detail-perms-list { display: flex; flex-wrap: wrap; gap: var(--oas-space-1); margin-top: var(--oas-space-2); }
      oas-modal[data-testid="user-form-modal"]::part(body) { overflow: visible; }
      .form-wizard oas-steps { margin-bottom: var(--oas-space-4); }
      .form-step { display: flex; flex-direction: column; gap: var(--oas-space-4); }
      .form-step[hidden] { display: none; }
      .form-error { color: var(--oas-color-danger); font-size: var(--oas-font-size-xs); margin-top: var(--oas-space-1); }
      .form-error[hidden] { display: none; }
      .form-field oas-textarea, .form-field oas-checkbox-group { width: 100%; }
      .switch-line { display: inline-flex; align-items: center; gap: var(--oas-space-2); min-height: var(--oas-control-height-md); }
      .form-total {
        display: flex; align-items: baseline; justify-content: flex-end;
        gap: var(--oas-space-3); font-size: var(--oas-font-size-sm); color: var(--oas-color-text-secondary);
      }
      .form-total .num {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 28px; font-weight: 700; color: var(--oas-color-text-primary);
      }
      .form-items { display: flex; flex-direction: column; gap: var(--oas-space-2); margin-top: var(--oas-space-4); }
      .form-item-row {
        display: flex; align-items: center; justify-content: space-between; gap: var(--oas-space-3);
        padding: var(--oas-space-2) var(--oas-space-3);
        background: var(--oas-color-bg-hover); border-radius: var(--oas-radius-md);
        font-size: var(--oas-font-size-sm); color: var(--oas-color-text-primary);
      }
      .form-item-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .form-item-calc { text-align: right; white-space: nowrap; }
      .form-confirm { margin-top: var(--oas-space-4); display: flex; flex-direction: column; gap: var(--oas-space-1); }
      .form-foot {
        position: sticky; bottom: 0; z-index: 1;
        display: flex; flex-direction: column; gap: var(--oas-space-3);
        margin: var(--oas-space-4) calc(-1 * var(--oas-space-4)) calc(-1 * var(--oas-space-4));
        padding: var(--oas-space-4);
        border-top: 1px solid var(--oas-color-border);
        background: var(--oas-color-bg);
      }
      .form-foot-summary[hidden] { display: none; }
      .form-foot .form-actions { margin-top: 0; padding-top: 0; border-top: none; }
      .toolbar {
        display: flex;
        gap: var(--oas-space-2);
        align-items: center;
        margin-bottom: var(--oas-space-3);
      }
      .toolbar oas-input { max-width: 240px; width: 100%; }
      .table-foot { display: flex; justify-content: flex-end; margin-top: var(--oas-space-3); }
      .form-grid { display: grid; gap: var(--oas-space-3); grid-template-columns: repeat(2, 1fr); margin-bottom: var(--oas-space-3); }
      .login-wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(800px 500px at 50% -100px, color-mix(in srgb, var(--oas-color-primary) 14%, transparent), transparent 70%), var(--oas-color-bg);
      }
      .login-card {
        max-width: 360px;
        width: calc(100% - 32px);
        padding: var(--oas-space-6);
        background: var(--oas-color-bg-elevated);
        border: 1px solid var(--oas-color-border);
        border-radius: var(--oas-radius-lg);
        box-shadow: 0 8px 30px color-mix(in srgb, var(--oas-color-overlay) 16%, transparent);
      }
      .login-card h1 { margin: 0 0 var(--oas-space-1); font-size: 22px; }
      .login-card .sub { margin: 0 0 var(--oas-space-5); font-size: 13px; color: var(--oas-color-text-secondary); }
      .login-card oas-input, .login-card oas-select, .login-card oas-button { width: 100%; margin-bottom: var(--oas-space-3); }
      .login-tip { margin: var(--oas-space-2) 0 0; font-size: 12px; color: var(--oas-color-text-secondary); text-align: center; }

      @media (max-width: 640px) {
        .form-grid { grid-template-columns: 1fr; }
        .toolbar { flex-wrap: wrap; }
        .chart-grid, .bottom-grid { grid-template-columns: 1fr; }
        .users-toolbar oas-input, .users-toolbar oas-select { width: 100%; }
      }
      @media (max-width: 992px) {
        .bottom-grid { grid-template-columns: 1fr; }
      }

.nav-toggle {
  display: none;
  background: none;
  border: none;
  color: var(--oas-color-text-primary);
  cursor: pointer;
  font-size: 20px;
  line-height: 1;
  padding: 0;
  width: 36px;
  height: 36px;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
}
@media (max-width: 768px) {
      .app-header { padding-left: var(--oas-space-4); }
  .nav-toggle {
    display: inline-flex;
  }
  @media (pointer: coarse) {
    .nav-toggle {
      width: 44px;
      height: 44px;
    }
  }
  /* 隐藏 oas-sidebar 自带 fixed 定位的 trigger，避免它浮在 logo 上 */
  oas-sidebar::part(trigger) {
    display: none !important;
  }
  /* 移动端：oas-sider 收为 0，避免左侧空白站位 */
  oas-sider,
  oas-sider[collapsed] {
    width: 0;
    padding: 0;
    overflow: hidden;
  }
}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
