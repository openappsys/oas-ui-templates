<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>部门管理 · OAS Admin CDN · MPA</title>
    <script src="./js/fouc.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@oas-ui/theme@2.5.3/index.css" />
    <script src="https://unpkg.com/@oas-ui/ui@2.5.3/dist/cdn.js"></script>
    <link rel="stylesheet" href="./css/app.css" />
    <link rel="stylesheet" href="./css/pages.css" />
    <link rel="stylesheet" href="./css/pages-b.css" />
  </head>
  <body>
    <oas-layout class="app" viewport>
      <header class="app-header" slot="header">
          <button id="nav-toggle" class="nav-toggle" type="button" aria-label="打开菜单">☰</button>
        <a class="oas-logo" href="/" style="text-decoration:none;color:inherit;cursor:pointer">
          <span class="oas-logo-badge">OAS</span>
          <span class="oas-logo-word" data-i18n="app.title">OAS Admin CDN · MPA</span>
        </a>
        <span class="spacer"></span>
        <button id="lang-toggle" data-testid="lang-toggle" class="icon-btn" type="button" data-i18n="header.lang">English</button>
        <button id="logout" class="icon-btn" type="button" data-i18n="header.logout">退出</button>
      </header>
      <oas-sider slot="sider">
        <oas-sidebar id="nav" active="./dept.html" items='[{"label":"仪表盘","value":"./dashboard.html","icon":"star","group":"菜单"},{"label":"用户管理","value":"./users.html","icon":"user","group":"菜单"},{"label":"基础表单","value":"./form.html","icon":"form","group":"菜单"}]'></oas-sidebar>
      </oas-sider>
      <div slot="content" id="view">
        <div class="page">
          <div class="page-head">
            <div>
              <h1 class="page-title" data-i18n="nav.dept">部门管理</h1>
              <p class="page-subtitle" data-i18n="dept.subtitle">维护组织架构与部门人数</p>
            </div>
            <oas-button data-testid="dept-create" type="primary" icon="plus" data-i18n="dept.new">新建部门</oas-button>
          </div>
          <oas-splitter class="dept-layout" percent="30" min="20" max="45">
            <oas-card slot="left" class="dept-tree-card" title="部门树" data-i18n-attr='{"title":"dept.treeTitle"}'>
              <oas-tree data-testid="dept-tree" id="dept-tree">
                <template slot="node">
                  <span class="tree-node-label">
                    <span data-node-label></span>
                    <span class="dept-member-badge"></span>
                  </span>
                </template>
              </oas-tree>
            </oas-card>
            <oas-card slot="right" class="dept-detail-card" title="部门详情" data-i18n-attr='{"title":"dept.detailTitle"}'>
              <div id="dept-detail" class="dept-detail"></div>
            </oas-card>
          </oas-splitter>

          <oas-drawer data-testid="dept-form-drawer" title="新建部门" placement="right" size="medium" no-footer data-i18n-attr='{"title":"dept.new"}'>
            <oas-form id="dept-form">
              <div class="dept-form-body">
                <div class="form-field">
                  <label class="form-label"><span data-i18n="dept.form.name">部门名称</span> <span class="req">*</span></label>
                  <oas-input data-testid="df-name" name="name" data-i18n-attr='{"placeholder":"dept.rule.name"}' placeholder="请输入部门名称"></oas-input>
                </div>
                <div class="form-field">
                  <label class="form-label" data-i18n="dept.form.parent">上级部门</label>
                  <oas-tree-select data-testid="df-parent" id="df-parent" data-i18n-attr='{"placeholder":"dept.placeholder.top"}' placeholder="顶级部门" options="[]" value="0"></oas-tree-select>
                </div>
                <div class="form-field">
                  <label class="form-label" data-i18n="dept.form.members">部门人数</label>
                  <oas-input-number data-testid="df-members" name="members" min="0" placeholder="0"></oas-input-number>
                </div>
                <div class="form-actions">
                  <oas-space justify="end">
                    <oas-button data-testid="df-cancel" data-i18n="common.cancel">取消</oas-button>
                    <oas-button data-testid="df-save" type="primary" data-i18n="common.save">保存</oas-button>
                  </oas-space>
                </div>
              </div>
            </oas-form>
          </oas-drawer>
        </div>
      </div>
    </oas-layout>
    <script type="module" src="./js/dept.js"></script>
  </body>
</html>
