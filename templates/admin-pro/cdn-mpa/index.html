<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OAS Admin CDN · MPA</title>
    <meta name="description" content="一页一 HTML 的多页后台范式：真实浏览器跳转、公共 JS 抽取复用、零运行时假设。" />
    <link rel="canonical" href="./"cdn-mpa/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OAS Admin CDN MPA — 多页应用后台" />
    <meta property="og:description" content="一页一 HTML 的多页后台范式：真实浏览器跳转、公共 JS 抽取复用、零运行时假设。" />
    <meta property="og:url" content="./cdn-mpa/" />
    <meta property="og:image" content="../../og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OAS Admin CDN MPA — 多页应用后台" />
    <meta name="twitter:description" content="一页一 HTML 的多页后台范式：真实浏览器跳转、公共 JS 抽取复用、零运行时假设。" />
    <meta name="twitter:image" content="../../og.png" />
    <script src="./js/fouc.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@oas-ui/theme@2.6.0/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/@oas-ui/theme@2.6.0/skins.css" />
    <link rel="stylesheet" href="https://unpkg.com/@oas-ui/theme@2.6.0/glass.css" />
    <script src="https://unpkg.com/@oas-ui/ui@2.6.0/dist/cdn.js"></script>
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-card">
        <h1 data-i18n="login.title">欢迎回来</h1>
        <p class="sub" data-i18n="login.subtitle">零构建 · CDN 引入 oas-ui 的轻量后台</p>
        <oas-input data-testid="login-name" data-i18n-attr='{"placeholder":"login.namePh"}' placeholder="输入任意用户名"></oas-input>
        <oas-select data-testid="login-role" value="admin" options='[]' data-i18n-attr='{"aria-label":"profile.role"}' aria-label="角色"></oas-select>
        <oas-button data-testid="login-submit" type="primary" data-i18n="login.submit">登 录</oas-button>
        <p class="login-tip" data-i18n="login.tip">演示环境：任意非空用户名即可登录</p>
      </div>
    </div>
    <script type="module" src="./js/login.js"></script>
  </body>
</html>
