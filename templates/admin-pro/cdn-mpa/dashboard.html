<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>仪表盘 · OAS Admin CDN · MPA</title>
    <script src="./js/fouc.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@oas-ui/theme@2.5.6/index.css" />
    <script src="https://unpkg.com/@oas-ui/ui@2.5.6/dist/cdn.js"></script>
    <link rel="stylesheet" href="./css/app.css" />
    <link rel="stylesheet" href="./css/pages.css" />
    <link rel="stylesheet" href="./css/dashboard.css" />
  </head>
  <body>
    <oas-layout class="app" viewport>
      <header class="app-header" slot="header">
          <button id="nav-toggle" class="nav-toggle" type="button" aria-label="打开菜单">☰</button>
        <a class="oas-logo" href="/" style="text-decoration:none;color:inherit;cursor:pointer">
          <span class="oas-logo-badge">OAS</span>
          <span class="oas-logo-word" data-i18n="app.title">OAS Admin CDN · MPA</span>
        </a>
        <span class="spacer"></span>
        <button id="lang-toggle" data-testid="lang-toggle" class="icon-btn" type="button" data-i18n="header.lang">English</button>
        <button id="logout" class="icon-btn" type="button" data-i18n="header.logout">退出</button>
      </header>
      <oas-sider slot="sider">
        <oas-sidebar id="nav" accordion active="./dashboard.html" items='[{"label":"仪表盘","value":"./dashboard.html","icon":"star","group":"菜单"},{"label":"用户管理","value":"./users.html","icon":"user","group":"菜单"},{"label":"基础表单","value":"./form.html","icon":"form","group":"菜单"}]'></oas-sidebar>
      </oas-sider>
      <div slot="content" id="view">
        <div class="page">
          <div class="page-head">
            <div>
              <h1 class="page-title" data-i18n="nav.dashboard">仪表盘</h1>
              <p class="page-subtitle" id="dash-welcome"></p>
            </div>
            <oas-space>
              <oas-button id="dash-refresh" icon="refresh" data-i18n="common.refresh">刷新</oas-button>
              <oas-button id="dash-export" icon="download" data-i18n="dashboard.export">导出</oas-button>
            </oas-space>
          </div>
          <div class="stat-grid" id="stat-grid">
            <oas-card class="stat-card stat-card--skeleton"><oas-skeleton active rows="3"></oas-skeleton></oas-card>
            <oas-card class="stat-card stat-card--skeleton"><oas-skeleton active rows="3"></oas-skeleton></oas-card>
            <oas-card class="stat-card stat-card--skeleton"><oas-skeleton active rows="3"></oas-skeleton></oas-card>
            <oas-card class="stat-card stat-card--skeleton"><oas-skeleton active rows="3"></oas-skeleton></oas-card>
          </div>
          <div class="chart-grid">
            <oas-card title="访问趋势" data-i18n-attr='{"title":"dashboard.trendTitle"}'>
              <oas-segmented id="trend-range" slot="extra"></oas-segmented>
              <oas-chart id="chart-trend" class="chart" type="area" options='{"smooth":true,"gradient":true}' aria-label="访问趋势" data-i18n-attr='{"aria-label":"dashboard.trendTitle"}'></oas-chart>
            </oas-card>
            <oas-card title="订单构成" data-i18n-attr='{"title":"dashboard.ordersTitle"}'>
              <oas-chart id="chart-orders" class="chart" type="donut" options='{"colors":["var(--oas-color-success)","var(--oas-color-primary)","var(--oas-color-warning)","var(--oas-color-danger)"]}' aria-label="订单构成" data-i18n-attr='{"aria-label":"dashboard.ordersTitle"}'></oas-chart>
              <div id="donut-legend-wrap"></div>
            </oas-card>
          </div>
          <div class="bottom-grid">
            <oas-card title="最近订单" data-i18n-attr='{"title":"dashboard.recentOrders"}'>
              <button id="orders-view-all" class="link-btn" slot="extra">
                <span data-i18n="dashboard.viewAll">查看全部</span> <oas-icon name="chevron-right" size="12"></oas-icon>
              </button>
              <oas-table data-testid="orders-table" row-key="id" data="[]"></oas-table>
            </oas-card>
            <oas-card title="热销商品 Top5" data-i18n-attr='{"title":"dashboard.topProducts"}'>
              <a class="link-btn" href="./products.html" slot="extra">
                <span data-i18n="dashboard.viewAll">查看全部</span> <oas-icon name="chevron-right" size="12"></oas-icon>
              </a>
              <div id="top5-list" data-testid="top5-list" class="top5-list"></div>
            </oas-card>
            <oas-card class="quick-card" title="快捷操作" data-i18n-attr='{"title":"dashboard.quickActions"}'>
              <div class="quick-actions" data-testid="quick-actions"></div>
              <div class="quick-foot" data-i18n="dashboard.techNote">Web Components 驱动 · 零框架运行时</div>
            </oas-card>
          </div>
        </div>
      </div>
    </oas-layout>
    <script type="module" src="./js/dashboard.js"></script>
  </body>
</html>
