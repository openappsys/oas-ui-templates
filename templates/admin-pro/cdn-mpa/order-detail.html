<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>订单详情 · OAS Admin CDN · MPA</title>
    <script src="./js/fouc.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@oas-ui/theme@2.5.6/index.css" />
    <script src="https://unpkg.com/@oas-ui/ui@2.5.6/dist/cdn.js"></script>
    <link rel="stylesheet" href="./css/app.css" />
    <link rel="stylesheet" href="./css/pages.css" />
  </head>
  <body>
    <oas-layout class="app" viewport>
      <header class="app-header" slot="header">
          <button id="nav-toggle" class="nav-toggle" type="button" aria-label="打开菜单">☰</button>
        <a class="oas-logo" href="/" style="text-decoration:none;color:inherit;cursor:pointer">
          <span class="oas-logo-badge">OAS</span>
          <span class="oas-logo-word" data-i18n="app.title">OAS Admin CDN · MPA</span>
        </a>
        <span class="spacer"></span>
        <button id="lang-toggle" data-testid="lang-toggle" class="icon-btn" type="button" data-i18n="header.lang">English</button>
        <button id="logout" class="icon-btn" type="button" data-i18n="header.logout">退出</button>
      </header>
      <oas-sider slot="sider">
        <oas-sidebar id="nav" accordion active="./orders.html" items='[{"label":"总览","value":"nav.group.overview","icon":"eye","children":[{"label":"仪表盘","value":"./dashboard.html","icon":"star"},{"label":"数据看板","value":"./data-board.html","icon":"eye"}]},{"label":"业务","value":"nav.group.business","icon":"organization","children":[{"label":"订单管理","value":"./orders.html","icon":"calendar"},{"label":"商品管理","value":"./products.html","icon":"edit"},{"label":"用户管理","value":"./users.html","icon":"user"}]},{"label":"系统","value":"nav.group.system","icon":"gear","children":[{"label":"角色管理","value":"./roles.html","icon":"star-filled"},{"label":"权限管理","value":"./menus.html","icon":"lock"},{"label":"部门管理","value":"./dept.html","icon":"organization"},{"label":"商品分类","value":"./category.html","icon":"tree"},{"label":"字典管理","value":"./dict.html","icon":"search"},{"label":"日志中心","value":"./logs.html","icon":"clock"},{"label":"设置中心","value":"./settings.html","icon":"filter"}]},{"label":"示例","value":"nav.group.demo","icon":"menu","children":[{"label":"无权访问","value":"./forbidden.html","icon":"warning"},{"label":"页面不存在","value":"./not-found.html","icon":"search"},{"label":"页面加载失败","value":"./500.html","icon":"error"},{"label":"基础表单","value":"./basic-form.html","icon":"form"},{"label":"高级表单","value":"./advanced-form.html","icon":"menu"}]}]'></oas-sidebar>
      </oas-sider>
      <div slot="content" id="view">
        <div class="page order-detail-page">
          <oas-page-header data-testid="order-page-header" class="order-detail-ph" data-i18n-attr='{"title":"nav.orderDetail"}' title="订单详情">
            <div slot="extra" class="ph-extra">
              <a class="link-btn" href="./orders.html" data-testid="order-back" data-i18n="orderDetail.backList">返回列表</a>
              <oas-tag data-testid="order-status-tag" data-i18n="orderDetail.loading">加载中</oas-tag>
            </div>
          </oas-page-header>
          <div id="order-detail-card">
            <oas-card>
              <div id="order-detail-steps" hidden></div>
              <oas-descriptions data-testid="order-detail-basic" id="order-detail-basic" column="2"></oas-descriptions>
              <div class="order-timeline-head" data-i18n="orderDetail.timelineTitle">操作日志</div>
              <div id="order-detail-timeline-wrap"></div>
              <div class="order-detail-foot">
                <oas-button data-testid="order-detail-action" type="primary" hidden></oas-button>
                <div class="order-detail-note" id="order-detail-note" hidden></div>
              </div>
            </oas-card>
          </div>
          <div id="order-detail-missing" hidden></div>
        </div>
      </div>
    </oas-layout>
    <script type="module" src="./js/order-detail.js"></script>
  </body>
</html>
