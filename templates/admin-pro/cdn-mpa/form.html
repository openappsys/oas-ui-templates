<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>创建订单 · OAS Admin CDN · MPA</title>
    <script src="./js/fouc.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@oas-ui/theme@2.5.6/index.css" />
    <script src="https://unpkg.com/@oas-ui/ui@2.5.6/dist/cdn.js"></script>
    <link rel="stylesheet" href="./css/app.css" />
    <link rel="stylesheet" href="./css/pages.css" />
    <link rel="stylesheet" href="./css/form.css" />
  </head>
  <body>
    <oas-layout class="app" viewport>
      <header class="app-header" slot="header">
          <button id="nav-toggle" class="nav-toggle" type="button" aria-label="打开菜单">☰</button>
        <a class="oas-logo" href="/" style="text-decoration:none;color:inherit;cursor:pointer">
          <span class="oas-logo-badge">OAS</span>
          <span class="oas-logo-word" data-i18n="app.title">OAS Admin CDN · MPA</span>
        </a>
        <span class="spacer"></span>
        <button id="lang-toggle" data-testid="lang-toggle" class="icon-btn" type="button" data-i18n="header.lang">English</button>
        <button id="logout" class="icon-btn" type="button" data-i18n="header.logout">退出</button>
      </header>
      <oas-sider slot="sider">
        <oas-sidebar id="nav" active="" items='[{"label":"仪表盘","value":"./dashboard.html","icon":"star","group":"菜单"},{"label":"用户管理","value":"./users.html","icon":"user","group":"菜单"},{"label":"基础表单","value":"./form.html","icon":"form","group":"菜单"}]'></oas-sidebar>
      </oas-sider>
      <div slot="content" id="view">
        <div class="page form-wizard">
          <div class="page-head">
            <div>
              <h1 class="page-title" data-i18n="nav.createOrder">创建订单</h1>
              <p class="page-subtitle" id="form-subtitle"></p>
            </div>
          </div>
          <oas-card>
            <oas-steps data-testid="form-steps" id="form-steps" current="0" clickable></oas-steps>
            <div class="form-step" data-testid="form-step1" data-index="0">
              <div class="form-field">
                <label class="form-label" for="form-customer"><span class="label-text"></span><span class="req">*</span></label>
                <oas-input data-testid="form-customer" clearable></oas-input>
                <div class="form-error" data-testid="form-error-customer" hidden></div>
              </div>
              <div class="form-field">
                <label class="form-label" for="form-phone"><span class="label-text"></span><span class="req">*</span></label>
                <oas-input data-testid="form-phone" clearable></oas-input>
                <div class="form-error" data-testid="form-error-phone" hidden></div>
              </div>
              <div class="form-field">
                <label class="form-label" for="form-note"><span class="label-text"></span></label>
                <oas-textarea data-testid="form-note" rows="3"></oas-textarea>
              </div>
            </div>
            <div class="form-step" data-testid="form-step2" data-index="1" hidden>
              <div class="form-field">
                <div class="form-label"><span class="label-text"></span><span class="req">*</span></div>
                <oas-checkbox-group data-testid="form-products" id="form-products" value="[]">
                  <span slot="label"></span>
                </oas-checkbox-group>
                <div class="form-error" data-testid="form-error-products" hidden></div>
              </div>
              <div class="form-grid">
                <div class="form-field">
                  <label class="form-label" for="form-qty"><span class="label-text"></span></label>
                  <oas-input-number data-testid="form-qty" min="1" precision="0" value="1"></oas-input-number>
                </div>
                <div class="form-field">
                  <label class="form-label" for="form-urgent"><span class="label-text"></span></label>
                  <div class="switch-line">
                    <oas-switch data-testid="form-urgent"></oas-switch>
                  </div>
                </div>
              </div>
              <div class="form-field">
                <label class="form-label" for="form-date"><span class="label-text"></span></label>
                <oas-date-picker data-testid="form-date"></oas-date-picker>
              </div>
            </div>
            <div class="form-step" data-testid="form-step3" data-index="2" hidden>
              <oas-descriptions data-testid="form-summary" column="1"></oas-descriptions>
              <div class="form-items" data-testid="form-items" id="form-items"></div>
            </div>
            <div class="form-foot">
              <div class="form-foot-summary" data-testid="form-foot-summary" id="form-foot-summary" hidden>
                <div class="form-total"><span class="total-text"></span><span class="num mono" data-testid="form-total" id="form-total"></span></div>
                <div class="form-confirm">
                  <oas-checkbox data-testid="form-confirm" data-i18n="form.confirm">我已核对信息</oas-checkbox>
                  <div class="form-error" data-testid="form-error-confirm" hidden></div>
                </div>
              </div>
              <div class="form-actions">
                <oas-space justify="end">
                  <oas-button data-testid="form-prev" data-i18n="form.prev">上一步</oas-button>
                  <oas-button data-testid="form-next" type="primary" data-i18n="form.next">下一步</oas-button>
                  <oas-button data-testid="form-submit" type="primary" hidden data-i18n="form.submit">提交</oas-button>
                </oas-space>
              </div>
            </div>
          </oas-card>
        </div>
      </div>
    </oas-layout>
    <script type="module" src="./js/form.js"></script>
  </body>
</html>
