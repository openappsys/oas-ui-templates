<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>编辑商品 · OAS Admin CDN · MPA</title>
    <script src="./js/fouc.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@oas-ui/theme@2.5.6/index.css" />
    <script src="https://unpkg.com/@oas-ui/ui@2.5.6/dist/cdn.js"></script>
    <link rel="stylesheet" href="./css/app.css" />
    <link rel="stylesheet" href="./css/pages.css" />
  </head>
  <body>
    <oas-layout class="app" viewport>
      <header class="app-header" slot="header">
          <button id="nav-toggle" class="nav-toggle" type="button" aria-label="打开菜单">☰</button>
        <a class="oas-logo" href="/" style="text-decoration:none;color:inherit;cursor:pointer">
          <span class="oas-logo-badge">OAS</span>
          <span class="oas-logo-word" data-i18n="app.title">OAS Admin CDN · MPA</span>
        </a>
        <span class="spacer"></span>
        <button id="lang-toggle" data-testid="lang-toggle" class="icon-btn" type="button" data-i18n="header.lang">English</button>
        <button id="logout" class="icon-btn" type="button" data-i18n="header.logout">退出</button>
      </header>
      <oas-sider slot="sider">
        <oas-sidebar id="nav" accordion active="./products.html" items='[{"label":"总览","value":"nav.group.overview","icon":"eye","children":[{"label":"仪表盘","value":"./dashboard.html","icon":"star"},{"label":"数据看板","value":"./data-board.html","icon":"eye"}]},{"label":"业务","value":"nav.group.business","icon":"organization","children":[{"label":"订单管理","value":"./orders.html","icon":"calendar"},{"label":"商品管理","value":"./products.html","icon":"edit"},{"label":"用户管理","value":"./users.html","icon":"user"}]},{"label":"系统","value":"nav.group.system","icon":"gear","children":[{"label":"角色管理","value":"./roles.html","icon":"star-filled"},{"label":"权限管理","value":"./menus.html","icon":"lock"},{"label":"部门管理","value":"./dept.html","icon":"organization"},{"label":"商品分类","value":"./category.html","icon":"tree"},{"label":"字典管理","value":"./dict.html","icon":"search"},{"label":"日志中心","value":"./logs.html","icon":"clock"},{"label":"设置中心","value":"./settings.html","icon":"filter"}]},{"label":"示例","value":"nav.group.demo","icon":"menu","children":[{"label":"无权访问","value":"./forbidden.html","icon":"warning"},{"label":"页面不存在","value":"./not-found.html","icon":"search"},{"label":"页面加载失败","value":"./500.html","icon":"error"},{"label":"基础表单","value":"./basic-form.html","icon":"form"},{"label":"高级表单","value":"./advanced-form.html","icon":"menu"}]}]'></oas-sidebar>
      </oas-sider>
      <div slot="content" id="view">
        <div class="page product-edit-page">
          <oas-page-header data-testid="pe-page-header" title="新建商品" id="pe-header">
            <div slot="extra" class="ph-extra">
              <a class="link-btn" href="./products.html" data-testid="pe-back" data-i18n="orderDetail.backList">返回列表</a>
            </div>
          </oas-page-header>
          <oas-card>
            <oas-form id="product-form">
              <div class="product-form">
                <div class="form-field">
                  <label class="form-label" for="pf-name"><span data-i18n="products.form.name">商品名称</span><span class="req">*</span></label>
                  <oas-input data-testid="pf-name" name="name" data-i18n-attr='{"placeholder":"products.form.namePlaceholder"}' placeholder="请输入名称"></oas-input>
                </div>
                <div class="form-field">
                  <label class="form-label" for="pf-category" data-i18n="products.category">分类</label>
                  <oas-select data-testid="pf-category" name="category" options='[]'></oas-select>
                </div>
                <div class="form-grid">
                  <div class="form-field">
                    <label class="form-label" for="pf-price" data-i18n="products.th.price">价格</label>
                    <oas-input-number data-testid="pf-price" name="price" min="0.01" precision="2" placeholder="0.00"></oas-input-number>
                  </div>
                  <div class="form-field">
                    <label class="form-label" for="pf-stock" data-i18n="products.th.stock">库存</label>
                    <oas-input-number data-testid="pf-stock" name="stock" min="0" placeholder="0"></oas-input-number>
                  </div>
                </div>
                <div class="form-field">
                  <label class="form-label" for="pf-date" data-i18n="products.form.listedDate">上架日期</label>
                  <oas-date-picker data-testid="pf-date" data-i18n-attr='{"placeholder":"products.form.datePlaceholder"}' placeholder="选择日期"></oas-date-picker>
                </div>
                <div class="form-field">
                  <label class="form-label" for="pf-cover" data-i18n="products.form.cover">封面</label>
                  <oas-upload data-testid="pf-cover" accept="image/*" list-type="picture"></oas-upload>
                </div>
                <div class="form-actions">
                  <oas-space justify="end">
                    <oas-button data-testid="pe-cancel" data-i18n="common.cancel">取消</oas-button>
                    <oas-button data-testid="pe-save" type="primary" data-i18n="common.save">保存</oas-button>
                  </oas-space>
                </div>
              </div>
            </oas-form>
          </oas-card>
        </div>
      </div>
    </oas-layout>
    <script type="module" src="./js/product-edit.js"></script>
  </body>
</html>
