<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>用户管理 · OAS Admin CDN · MPA</title>
    <script src="./js/fouc.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@oas-ui/theme@2/index.css" />
    <script src="https://unpkg.com/@oas-ui/ui@2/dist/cdn.js"></script>
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <oas-layout class="app" viewport>
      <header class="app-header" slot="header">
          <button id="nav-toggle" class="nav-toggle" type="button" aria-label="打开菜单">☰</button>
        <span class="logo" data-i18n="app.title">OAS Admin CDN · MPA</span>
        <span class="spacer"></span>
        <button id="lang-toggle" data-testid="lang-toggle" class="icon-btn" type="button" data-i18n="header.lang">English</button>
        <button id="logout" class="icon-btn" type="button" data-i18n="header.logout">退出</button>
      </header>
      <oas-sider slot="sider">
        <oas-sidebar id="nav" active="./users.html" items='[{"label":"仪表盘","value":"./dashboard.html","icon":"star","group":"菜单"},{"label":"用户管理","value":"./users.html","icon":"user","group":"菜单"},{"label":"基础表单","value":"./form.html","icon":"form","group":"菜单"}]'></oas-sidebar>
      </oas-sider>
      <div slot="content" id="view">
        <div class="page">
          <h1 class="page-title" data-i18n="users.title">用户管理</h1>
          <div class="toolbar">
            <oas-input data-testid="users-search" data-i18n-attr='{"placeholder":"users.searchPh"}' placeholder="搜索姓名 / 邮箱"></oas-input>
            <oas-button data-testid="user-new" type="primary" data-i18n="users.new">新建用户</oas-button>
          </div>
          <oas-card>
            <oas-table data-testid="users-table"></oas-table>
            <div class="table-foot">
              <oas-pagination data-testid="users-pager" page-size="8" current="1" total="0" show-total></oas-pagination>
            </div>
          </oas-card>
          <oas-modal data-testid="user-form-modal" no-footer>
            <div style="padding: var(--oas-space-4); min-width: 0">
              <h2 id="form-title" style="margin:0 0 var(--oas-space-3); font-size:16px" data-i18n="users.formNew">新建用户</h2>
              <oas-input data-testid="uf-name" data-i18n-attr='{"placeholder":"users.th.name"}' placeholder="姓名"></oas-input>
              <oas-input data-testid="uf-email" data-i18n-attr='{"placeholder":"users.th.email"}' placeholder="邮箱" style="margin-top: var(--oas-space-2)"></oas-input>
              <div style="display:flex; gap: var(--oas-space-2); justify-content:flex-end; margin-top: var(--oas-space-3)">
                <oas-button data-testid="uf-cancel" data-i18n="users.cancel">取消</oas-button>
                <oas-button data-testid="uf-save" type="primary" data-i18n="users.save">保存</oas-button>
              </div>
            </div>
          </oas-modal>
        </div>
      </div>
    </oas-layout>
    <script type="module" src="./js/users.js"></script>
  </body>
</html>
