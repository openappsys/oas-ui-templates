<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>用户管理 · OAS Admin CDN · MPA</title>
    <script src="./js/fouc.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@oas-ui/theme@2.5.6/index.css" />
    <script src="https://unpkg.com/@oas-ui/ui@2.5.6/dist/cdn.js"></script>
    <link rel="stylesheet" href="./css/app.css" />
    <link rel="stylesheet" href="./css/pages.css" />
    <link rel="stylesheet" href="./css/users.css" />
  </head>
  <body>
    <oas-layout class="app" viewport>
      <header class="app-header" slot="header">
          <button id="nav-toggle" class="nav-toggle" type="button" aria-label="打开菜单">☰</button>
        <a class="oas-logo" href="/" style="text-decoration:none;color:inherit;cursor:pointer">
          <span class="oas-logo-badge">OAS</span>
          <span class="oas-logo-word" data-i18n="app.title">OAS Admin CDN · MPA</span>
        </a>
        <span class="spacer"></span>
        <button id="lang-toggle" data-testid="lang-toggle" class="icon-btn" type="button" data-i18n="header.lang">English</button>
        <button id="logout" class="icon-btn" type="button" data-i18n="header.logout">退出</button>
      </header>
      <oas-sider slot="sider">
        <oas-sidebar id="nav" accordion active="./users.html" items='[{"label":"仪表盘","value":"./dashboard.html","icon":"star","group":"菜单"},{"label":"用户管理","value":"./users.html","icon":"user","group":"菜单"},{"label":"基础表单","value":"./form.html","icon":"form","group":"菜单"}]'></oas-sidebar>
      </oas-sider>
      <div slot="content" id="view">
        <div class="page">
          <div class="page-head">
            <div>
              <h1 class="page-title" data-i18n="users.title">用户管理</h1>
              <p class="page-subtitle" data-i18n="users.subtitle">管理系统成员与权限</p>
            </div>
            <oas-button data-testid="user-create" type="primary" icon="plus" data-i18n="users.new">新建用户</oas-button>
          </div>
          <oas-card class="list-card" title="用户列表" data-i18n-attr='{"title":"users.list"}'>
            <div class="users-toolbar" slot="extra">
              <oas-input data-testid="user-search" data-i18n-attr='{"placeholder":"users.search"}' placeholder="搜索姓名 / 邮箱" clearable prefix-icon="search"></oas-input>
              <oas-button id="users-refresh" icon="refresh" data-i18n-attr='{"title":"common.refresh"}' title="刷新"></oas-button>
            </div>
            <div class="table-wrap" id="table-wrap">
              <oas-table data-testid="users-table" row-key="id" data="[]" pagination></oas-table>
              <div class="empty-overlay" id="empty-overlay" hidden>
                <oas-empty data-i18n-attr='{"description":"users.empty"}' description="未找到匹配用户"></oas-empty>
                <oas-button id="clear-filters" type="primary" data-i18n="common.clearFilter">清除筛选</oas-button>
              </div>
            </div>
          </oas-card>

          <oas-modal data-testid="user-form-modal" no-footer>
            <div class="modal-body">
              <h2 id="form-title"></h2>
              <oas-form id="user-form">
                <div class="form-grid">
                  <oas-input data-testid="field-name" name="name" data-i18n-attr='{"placeholder":"users.name"}' placeholder="姓名"></oas-input>
                  <oas-input data-testid="field-email" name="email" data-i18n-attr='{"placeholder":"users.email"}' placeholder="邮箱"></oas-input>
                  <oas-select data-testid="field-role" name="roleId" options="[]"></oas-select>
                  <oas-select data-testid="field-status" name="status" options="[]"></oas-select>
                </div>
                <div class="form-actions">
                  <oas-space justify="end">
                    <oas-button data-testid="form-cancel" data-i18n="common.cancel">取消</oas-button>
                    <oas-button data-testid="form-save" type="primary" data-i18n="common.save">保存</oas-button>
                  </oas-space>
                </div>
              </oas-form>
            </div>
          </oas-modal>

          <oas-modal data-testid="user-detail-modal" no-footer>
            <div class="modal-body">
              <div class="detail-header">
                <oas-avatar id="detail-avatar" size="48"><span slot="fallback" id="detail-avatar-text"></span></oas-avatar>
                <div>
                  <div id="detail-name" class="detail-name"></div>
                  <oas-tag id="detail-role-tag" type="primary"></oas-tag>
                </div>
              </div>
              <oas-descriptions id="detail-desc" column="1"></oas-descriptions>
              <oas-divider></oas-divider>
              <div class="detail-perms-title form-label" data-i18n="users.perm">权限标识</div>
              <div id="detail-perms-list" class="detail-perms-list"></div>
              <oas-space justify="end">
                <oas-button data-testid="detail-edit" type="primary" data-i18n="common.edit">编辑</oas-button>
                <oas-popconfirm id="delete-popconfirm" data-i18n-attr='{"title":"users.confirmDelete"}' title="删除该用户？">
                  <oas-button data-testid="detail-delete" type="danger" data-i18n="common.delete">删除</oas-button>
                </oas-popconfirm>
              </oas-space>
            </div>
          </oas-modal>
        </div>
      </div>
    </oas-layout>
    <script type="module" src="./js/users.js"></script>
  </body>
</html>
