name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  repository_dispatch:
    types: [oas-ui-release]

jobs:
  vanilla:
    name: admin-pro/vanilla-html
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/admin-pro/vanilla-html
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: 提醒升级依赖（schedule/dispatch 才有意义）
        if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
        run: pnpm update @oas-ui/ui @oas-ui/theme && pnpm install --no-frozen-lockfile && pnpm test && pnpm build && pnpm test:e2e
